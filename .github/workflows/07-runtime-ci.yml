name: Mini Agent 01 LLM CI

on:
  push:
    branches: [main]
    paths: ["mini_agent_01_llm/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini_agent_01_llm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run backend tests
        working-directory: mini_agent_01_llm/backend
        run: python -m pytest tests -q
      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Build Backend and Frontend images
        run: docker compose --env-file .env.example build
