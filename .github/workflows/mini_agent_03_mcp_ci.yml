name: Mini Agent 03 MCP CI

on:
  push:
    paths:
      - "mini_agent_03_mcp/**"
      - ".github/workflows/mini_agent_03_mcp_ci.yml"
  pull_request:
    paths:
      - "mini_agent_03_mcp/**"
      - ".github/workflows/mini_agent_03_mcp_ci.yml"
  workflow_dispatch:

# 이 workflow는 검사와 이미지 빌드만 수행하며 Registry 게시이나 AWS 배포 권한을 갖지 않는다.
permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 3.12 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: MCP 의존성 설치
        run: python -m pip install -r mini_agent_03_mcp/requirements.txt

      - name: MCP 코드 import 점검
        working-directory: mini_agent_03_mcp
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -c "from backend.app.main import app; from mcp_server import travel_server; assert app.title == 'Mini Agent 03 MCP'; assert travel_server.MCP_PORT == 8010"

      - name: Docker Compose 구성 점검
        working-directory: mini_agent_03_mcp
        run: docker compose --env-file .env.example config --quiet

      - name: MCP Docker 이미지 빌드
        working-directory: mini_agent_03_mcp
        run: docker compose --env-file .env.example build
