name: Mini Agent 01 LLM Docker Hub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v, for example 1.0.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test backend
        working-directory: mini_agent_01_llm
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          cd backend
          python -m pytest tests -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: mini_agent_01_llm
          file: mini_agent_01_llm/backend/Dockerfile
          push: true
          tags: haedeuncha/mini-agent-01-llm:backend-${{ inputs.version }}
      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: mini_agent_01_llm
          file: mini_agent_01_llm/frontend/Dockerfile
          push: true
          tags: haedeuncha/mini-agent-01-llm:frontend-${{ inputs.version }}
