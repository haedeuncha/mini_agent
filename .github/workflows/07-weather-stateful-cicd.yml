name: Mini Agent 01 LLM wk01 Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Docker Hub version to deploy, for example 1.0.0"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: mini-agent-01-llm-wk01
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    environment: wk01
    steps:
      - uses: actions/checkout@v4
      - name: Configure wk01 SSH identity
        env:
          WK01_SSH_PRIVATE_KEY: ${{ secrets.WK01_SSH_PRIVATE_KEY }}
          WK01_SSH_KNOWN_HOSTS: ${{ secrets.WK01_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$WK01_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$WK01_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Copy release Compose definition
        env:
          WK01_HOST: ${{ secrets.WK01_HOST }}
          WK01_USER: ${{ secrets.WK01_USER }}
        run: |
          ssh "$WK01_USER@$WK01_HOST" 'mkdir -p ~/mini-agent-01-llm'
          scp mini_agent_01_llm/compose.release.yml "$WK01_USER@$WK01_HOST:~/mini-agent-01-llm/compose.release.yml"
      - name: Pull, run, and verify version on wk01
        env:
          WK01_HOST: ${{ secrets.WK01_HOST }}
          WK01_USER: ${{ secrets.WK01_USER }}
          VERSION: ${{ inputs.version }}
        run: |
          ssh "$WK01_USER@$WK01_HOST" "cd ~/mini-agent-01-llm && test -f .env && sed -i 's#^BACKEND_IMAGE=.*#BACKEND_IMAGE=haedeuncha/mini-agent-01-llm:backend-$VERSION#; s#^FRONTEND_IMAGE=.*#FRONTEND_IMAGE=haedeuncha/mini-agent-01-llm:frontend-$VERSION#' .env && docker compose --env-file .env -f compose.release.yml config --quiet && docker compose --env-file .env -f compose.release.yml pull && docker compose --env-file .env -f compose.release.yml up -d && curl --fail --retry 12 --retry-delay 5 http://127.0.0.1:8000/health"
