name: Mini Agent 03 Tool CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read







  
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mini_agent_03_tool/requirements.txt

      - name: Test backend contracts
        working-directory: mini_agent_03_tool/backend
        run: python -m pytest tests -q

      - name: Validate Compose
        working-directory: mini_agent_03_tool
        run: docker compose config --quiet

      - name: Build images
        working-directory: mini_agent_03_tool
        run: docker compose build
